<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARP + AmneziaWG Generator</title>
    <!-- Подключаем внешний файл со стилями -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>WARP -> AmneziaWG Builder</h1>
    
    <div class="form-group">
        <label>1. Вставь стандартный конфиг WARP (WireGuard)</label>
        <textarea id="inputConfig" placeholder="[Interface]
PrivateKey = ...
Address = ...

[Peer]
PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
Endpoint = ..."></textarea>
    </div>

    <div class="section-title">Настройки обфускации (AmneziaWG)</div>
    
    <div class="form-group">
        <button type="button" class="btn-secondary" id="btnRandomize">🎲 Сгенерировать случайные (Безопасные) параметры</button>
    </div>

    <div class="grid-4 form-group">
        <div><label>Jc</label><input type="number" id="jc" value="120"></div>
        <div><label>Jmin</label><input type="number" id="jmin" value="50"></div>
        <div><label>Jmax</label><input type="number" id="jmax" value="1000"></div>
        <div><label>S1</label><input type="number" id="s1" value="0"></div>
        <div><label>S2</label><input type="number" id="s2" value="0"></div>
        <div><label>H1</label><input type="number" id="h1" value="1"></div>
        <div><label>H2</label><input type="number" id="h2" value="2"></div>
        <div><label>H3</label><input type="number" id="h3" value="3"></div>
        <div><label>H4</label><input type="number" id="h4" value="4"></div>
    </div>

    <div class="section-title">Выбор локации / Endpoint</div>
    <div class="form-group">
        <select id="endpointSelect">
            <option value="auto">Оставить из исходного конфига</option>
            <option value="162.159.192.1:2408">Cloudflare IP 1 (162.159.192.1)</option>
            <option value="162.159.193.1:2408">Cloudflare IP 2 (162.159.193.1)</option>
            <option value="162.159.195.1:2408">Cloudflare IP 3 (162.159.195.1)</option>
            <option value="188.114.96.1:2408">Cloudflare IP 4 (188.114.96.1)</option>
            <option value="188.114.97.1:2408">Cloudflare IP 5 (188.114.97.1)</option>
            <option value="engage.cloudflareclient.com:2408">Оригинальный домен (engage)</option>
        </select>
    </div>

    <button id="btnGenerate">🚀 Создать AmneziaWG Конфиг</button>

    <div class="section-title">Итоговый конфиг</div>
    <div class="form-group">
        <textarea id="outputConfig" readonly placeholder="Здесь появится готовый конфиг для клиента AmneziaWG..."></textarea>
    </div>
    <button type="button" class="btn-secondary" id="btnCopy">📋 Скопировать</button>

</div>

<!-- Подключаем внешний файл со скриптами -->
<script src="script.js"></script>
</body>
</html>
